plugins {
    id 'com.android.application'
}

android {
    namespace 'com.durhamlistings.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.durhamlistings.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.9.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    buildFeatures {
        buildConfig true  // the updater compares BuildConfig.VERSION_CODE with the server's build
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The desktop server offers the phone its newest build: after each debug build, copy the APK and
// its version (from defaultConfig above, the single source of it) to where the server reads them.
def serverAppDir = rootProject.file('../app/listingtracker/mobile/android')
android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name != 'debug') return
    variant.assembleProvider.configure {
        doLast {
            def apk = variant.outputs.first().outputFile
            serverAppDir.mkdirs()
            copy {
                from apk
                into serverAppDir
                rename { 'DurhamListings.apk' }
            }
            new File(serverAppDir, 'version.json').text = groovy.json.JsonOutput.toJson([
                version_code: variant.versionCode,
                version_name: variant.versionName,
            ])
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
