plugins {
    id 'com.android.application'
}

// The release key lives outside the repository (android/signing/, ignored by git). Without it,
// release builds come out unsigned and are never copied to the server; debug builds still work.
def signingProps = new Properties()
def signingFile = rootProject.file('signing/keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.durhamlistings.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.durhamlistings.app"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "2.12.1"
    }

    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file("signing/${signingProps['storeFile']}")
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    buildFeatures {
        buildConfig true  // the updater compares BuildConfig.VERSION_CODE with the server's build
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The desktop server offers phones its newest build: after each release build, copy the APK and
// its version (from defaultConfig above, the single source of it) to where the server reads them.
// Only release builds, so phones are only ever offered APKs signed with the release key.
def serverAppDir = rootProject.file('../app/listingtracker/mobile/android')
android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name != 'release') return
    variant.assembleProvider.configure {
        doLast {
            if (!variant.signingReady) {
                throw new GradleException(
                        'Release build is unsigned: android/signing/keystore.properties is missing. ' +
                        'Restore the signing folder from its backup; a new key cannot update installed apps.')
            }
            def apk = variant.outputs.first().outputFile
            serverAppDir.mkdirs()
            copy {
                from apk
                into serverAppDir
                rename { 'DurhamListings.apk' }
            }
            new File(serverAppDir, 'version.json').text = groovy.json.JsonOutput.toJson([
                version_code: variant.versionCode,
                version_name: variant.versionName,
            ])
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
