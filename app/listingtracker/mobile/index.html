<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>Durham Listings</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #242444;
  --border: #2d2d5e;
  --text: #e8e8f0;
  --text2: #9898b8;
  --accent: #6c63ff;
  --accent2: #8b83ff;
  --green: #4caf50;
  --red: #ef5350;
  --gold: #ffd54f;
  --orange: #ff9800;
  --radius: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ---------- Header ---------- */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: var(--safe-top) 16px 0 16px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
}
.header h1 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
}
.icon-btn.active { color: var(--gold); border-color: var(--gold); }

/* Connection menu */
.header-top { position: relative; }
.conn-menu {
  display: none;
  position: absolute;
  top: calc(100% - 4px);
  right: 0;
  z-index: 200;
  min-width: 220px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  overflow: hidden;
}
.conn-menu.open { display: block; }
.conn-menu .conn-info {
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  word-break: break-all;
}
.conn-menu button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--text);
  padding: 13px 14px;
  font-size: 14px;
  cursor: pointer;
}
.conn-menu button.danger { color: var(--red); }
.conn-menu button[hidden] { display: none; }

/* Filter chips */
.filters {
  display: flex;
  gap: 8px;
  padding: 8px 0 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* ---------- Stats bar ---------- */
.stats-bar {
  display: flex;
  gap: 12px;
  padding: 12px 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat-card {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  min-width: 120px;
  text-align: center;
}
.stat-card .value { font-size: 22px; font-weight: 700; color: var(--accent2); }
.stat-card .label { font-size: 11px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }

/* ---------- Listing cards ---------- */
.listings { padding: 0 16px 100px; }
.listing-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .12s, border-color .12s;
}
.listing-card:active { transform: scale(0.98); }
.listing-card .card-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: var(--surface2);
  display: block;
}
.listing-card .card-image.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  color: var(--text2);
}
.card-body { padding: 12px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.card-address { font-size: 15px; font-weight: 600; line-height: 1.3; flex: 1; }
.card-fav {
  font-size: 20px;
  color: var(--text2);
  cursor: pointer;
  padding: 4px;
  flex-shrink: 0;
  background: none;
  border: none;
}
.card-fav.active { color: var(--gold); }
.card-meta { display: flex; gap: 12px; margin-top: 6px; color: var(--text2); font-size: 13px; }
.card-price {
  font-size: 20px;
  font-weight: 700;
  color: var(--green);
  margin-top: 8px;
}
.card-price.sold { color: var(--red); }
.card-badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.badge {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  background: var(--surface2);
  color: var(--text2);
}
.badge.for-sale { background: rgba(76,175,80,.15); color: var(--green); }
.badge.sold { background: rgba(239,83,80,.15); color: var(--red); }
.badge.conditional { background: rgba(255,152,0,.15); color: var(--orange); }

/* ---------- Detail overlay ---------- */
.detail-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--bg);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateX(100%);
  transition: transform .25s ease;
}
.detail-overlay.open { transform: translateX(0); }
.detail-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(var(--safe-top) + 12px) 16px 12px;
}
.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 24px;
  cursor: pointer;
  padding: 4px;
}
.detail-title { font-size: 16px; font-weight: 600; flex: 1; }
.detail-fav-btn {
  font-size: 24px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
}

.detail-gallery {
  position: relative;
  width: 100%;
  height: 260px;
  overflow: hidden;
  background: var(--surface2);
}
.detail-gallery img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.gallery-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,.5);
  color: #fff;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
}
.gallery-nav.prev { left: 8px; }
.gallery-nav.next { right: 8px; }
.gallery-counter {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0,0,0,.6);
  color: #fff;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
}

.detail-content { padding: 16px; padding-bottom: calc(var(--safe-bottom) + 80px); }
.detail-price { font-size: 28px; font-weight: 700; color: var(--green); }
.detail-price.sold { color: var(--red); }
.detail-status-badge { display: inline-block; margin-left: 8px; vertical-align: middle; }

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 16px;
}
.info-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.info-item .info-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.info-item .info-value { font-size: 15px; font-weight: 600; margin-top: 2px; }

.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-top: 24px;
  margin-bottom: 12px;
}

.history-summary { font-size: 13px; margin: -4px 0 10px; }
.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
}
.history-date { font-size: 13px; color: var(--text2); }
.history-note { font-size: 11px; color: var(--text2); opacity: .75; margin-top: 2px; }
.history-price { font-size: 15px; font-weight: 600; text-align: right; }
.history-change { font-size: 12px; font-weight: 600; text-align: right; margin-top: 2px; }
.down { color: var(--green); }
.up { color: var(--red); }

.forecast-card {
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 14px;
}
.forecast-head { display: flex; align-items: baseline; gap: 8px; }
.forecast-when { font-size: 20px; font-weight: 700; color: var(--accent2); }
.forecast-conf {
  margin-left: auto; font-size: 11px; font-weight: 600; text-transform: uppercase;
  padding: 2px 8px; border-radius: 10px; background: var(--surface2); color: var(--text2);
}
.forecast-conf.high { color: var(--green); }
.forecast-conf.medium { color: var(--gold); }
.forecast-window { font-size: 12px; color: var(--text2); margin-top: 2px; }
.forecast-price { font-size: 14px; margin-top: 10px; }
.forecast-basis { font-size: 12px; color: var(--text2); margin-top: 8px; line-height: 1.5; }

.detail-link {
  display: block;
  text-align: center;
  background: var(--accent);
  color: #fff;
  padding: 14px;
  border-radius: var(--radius);
  font-weight: 600;
  text-decoration: none;
  margin-top: 20px;
}

/* ---------- Comparable cards ---------- */
.comp-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
}
.comp-card.in-range {
  background: rgba(76,175,80,.08);
  border-color: var(--green);
}
.comp-addr { font-size: 13px; font-weight: 600; color: var(--text); }
.comp-price-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.comp-price { font-size: 15px; font-weight: 700; color: var(--accent); }
.comp-gap { font-size: 12px; font-weight: 600; }
.comp-gap.near { color: var(--gold); }
.comp-gap.far { color: var(--red); }
.comp-gap.hit { color: var(--green); }
.comp-specs { font-size: 11px; color: var(--text2); margin-top: 2px; }
.comp-trend { font-size: 11px; margin-top: 4px; }
.comp-score { font-size: 11px; color: var(--text2); margin-left: auto; }
.comp-scan-btn {
  display: block; width: 100%; padding: 10px; margin-top: 12px;
  background: var(--surface2); color: var(--accent2); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer;
}

/* ---------- Login screen ---------- */
.login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 32px;
}
.login-screen h1 {
  font-size: 24px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.login-screen p { color: var(--text2); margin-bottom: 24px; font-size: 14px; text-align: center; }
.login-screen input {
  width: 100%;
  max-width: 340px;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
  margin-bottom: 12px;
}
.login-screen input::placeholder { color: var(--text2); }
.login-screen button {
  width: 100%;
  max-width: 340px;
  padding: 14px;
  border-radius: var(--radius);
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.login-screen .error { color: var(--red); font-size: 13px; margin-top: 8px; }
.login-screen .or-divider {
  color: var(--text2); font-size: 13px; margin: 16px 0 8px; text-align: center;
}
.scan-qr-btn {
  width: 100%; max-width: 340px; padding: 14px; border-radius: var(--radius);
  border: 2px solid var(--accent); background: transparent; color: var(--accent);
  font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
}
.scan-qr-btn:hover { background: rgba(21,101,192,0.1); }
#qrScanOverlay {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.95); flex-direction: column; align-items: center;
  justify-content: center;
}
#qrScanOverlay.active { display: flex; }
#qrScanOverlay video {
  width: 90%; max-width: 400px; border-radius: 12px; border: 3px solid var(--accent);
}
#qrScanOverlay .scan-hint {
  color: #fff; font-size: 15px; margin: 16px 0; text-align: center;
}
#qrScanOverlay .scan-cancel {
  background: #333; color: #fff; border: none; border-radius: 8px;
  padding: 12px 32px; font-size: 14px; cursor: pointer; margin-top: 12px;
}
#qrScanOverlay canvas { display: none; }

/* ---------- Loading / empty ---------- */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text2);
  font-size: 14px;
}
.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
  margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.retry-btn {
  margin-top: 16px; padding: 10px 24px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
}

/* Sort dropdown */
.sort-select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 13px;
}

/* Pull to refresh indicator */
.pull-indicator {
  text-align: center;
  padding: 12px;
  color: var(--text2);
  font-size: 13px;
  display: none;
}
.pull-indicator.visible { display: block; }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
  <h1>Durham Listings</h1>
  <p>Enter your API key to connect<br>to your listing tracker</p>
  <input type="text" id="serverUrl" placeholder="Server address">
  <input type="password" id="apiKeyInput" placeholder="API Key">
  <button onclick="doLogin()">Connect</button>
  <div class="or-divider">— or —</div>
  <button class="scan-qr-btn" onclick="startQrScan()">Scan QR Code</button>
  <div id="loginError" class="error" style="display:none"></div>
</div>

<!-- QR Scanner Overlay -->
<div id="qrScanOverlay">
  <div class="scan-hint">Point your camera at the QR code<br>shown on the desktop app</div>
  <video id="qrVideo" autoplay playsinline></video>
  <button class="scan-cancel" onclick="stopQrScan()">Cancel</button>
</div>

<!-- Main App -->
<div id="mainApp" style="display:none">
  <div class="header">
    <div class="header-top">
      <h1>Durham Listings</h1>
      <div class="header-actions">
        <select class="sort-select" id="sortSelect" onchange="changeSort()">
          <option value="date">Newest</option>
          <option value="price">Price: Low</option>
          <option value="price_desc">Price: High</option>
          <option value="city">City</option>
        </select>
        <button class="icon-btn" id="favFilterBtn" onclick="toggleFavFilter()" title="Favorites only">&#9733;</button>
        <button class="icon-btn" onclick="refreshListings()" title="Refresh">&#x21bb;</button>
        <button class="icon-btn" id="connMenuBtn" onclick="toggleConnMenu(event)" title="Connection">&#8942;</button>
      </div>
      <div class="conn-menu" id="connMenu">
        <div class="conn-info" id="connInfo"></div>
        <button onclick="reconnect()">Reconnect</button>
        <button id="updateBtn" onclick="AndroidApp.checkForUpdate()" hidden>Check for app update</button>
        <button class="danger" onclick="disconnect()">Disconnect</button>
      </div>
    </div>
    <div class="filters" id="cityFilters"></div>
  </div>

  <div class="stats-bar" id="statsBar"></div>
  <div class="pull-indicator" id="pullIndicator">Pull down to refresh...</div>
  <div class="listings" id="listingsContainer">
    <div class="loading"><div class="spinner"></div> Loading listings...</div>
  </div>
</div>

<!-- Detail Overlay -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-header">
    <button class="back-btn" onclick="history.back()">&#8592;</button>
    <div class="detail-title" id="detailTitle"></div>
    <button class="detail-fav-btn" id="detailFavBtn" onclick="toggleDetailFav()">&#9734;</button>
  </div>
  <div id="detailContent"></div>
</div>

<script>
const API_TIMEOUT = 15000;
const RETRIES = 2;
const SOLD_STATUSES = new Set(['SOLD', 'SOLD_CONDITIONAL', 'TERMINATED']);
const STATUS_LABELS = { FOR_SALE: 'For Sale', SOLD: 'Sold', SOLD_CONDITIONAL: 'Sold Conditional',
  TERMINATED: 'Terminated', EXPIRED: 'Expired', DELISTED: 'Delisted', BLOCKED: 'Blocked', UNKNOWN: 'Unknown' };

let serverUrl = '';
let apiKey = '';
let listings = [];  // every active listing, as the server sent it; filtering and sorting happen here
const currentFilter = { city: null, favOnly: false, sort: 'date' };
let currentDetailId = null;
let currentGalleryIndex = 0;
let detailData = null;

const $ = id => document.getElementById(id);

// ------ Persistence ------
function saveCredentials() {
  try {
    localStorage.setItem('lt_server', serverUrl);
    localStorage.setItem('lt_key', apiKey);
  } catch(e) {}
}
function loadCredentials() {
  try {
    serverUrl = localStorage.getItem('lt_server') || '';
    apiKey = localStorage.getItem('lt_key') || '';
  } catch(e) {}
}
function clearCredentials() {
  try {
    localStorage.removeItem('lt_server');
    localStorage.removeItem('lt_key');
  } catch(e) {}
}

// ------ API calls ------
class ApiError extends Error {
  constructor(status) { super(`HTTP ${status}`); this.status = status; }
}

// GETs are retried on network errors and server errors; a refused key is not retried.
async function apiFetch(path, opts = {}) {
  const attempts = (opts.method || 'GET') === 'GET' ? RETRIES + 1 : 1;
  for (let attempt = 1; ; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), API_TIMEOUT);
    try {
      const resp = await fetch(serverUrl.replace(/\/+$/, '') + path, {
        ...opts,
        signal: controller.signal,
        headers: { ...(opts.headers || {}), 'X-API-Key': apiKey },
      });
      if (!resp.ok) throw new ApiError(resp.status);
      return await resp.json();
    } catch(e) {
      const permanent = e instanceof ApiError && e.status < 500;
      if (permanent || attempt >= attempts) throw e;
      await new Promise(r => setTimeout(r, 1000));
    } finally {
      clearTimeout(timer);
    }
  }
}

// ------ Connecting ------
// Loading the listings doubles as the key check, so connecting costs one request.
async function connect() {
  const data = await apiFetch('/api/listings');
  saveCredentials();
  $('loginScreen').style.display = 'none';
  $('mainApp').style.display = 'block';
  setListings(data.listings);
}

function showLogin(message) {
  $('serverUrl').value = serverUrl;
  $('apiKeyInput').value = apiKey;
  $('mainApp').style.display = 'none';
  $('loginScreen').style.display = '';
  const errEl = $('loginError');
  errEl.textContent = message || '';
  errEl.style.display = message ? 'block' : 'none';
}

async function doLogin() {
  serverUrl = $('serverUrl').value.trim();
  apiKey = $('apiKeyInput').value.trim();
  if (!serverUrl || !apiKey) {
    showLogin('Please fill in both fields');
    return;
  }
  try {
    await connect();
  } catch(e) {
    showLogin('Connection failed. Check the server address and API key.');
  }
}

// ------ Connection menu ------
// Inside the Android app, window.AndroidApp hands these actions to the app, which owns the pairing.
function toggleConnMenu(e) {
  e.stopPropagation();
  let host = serverUrl;
  try { host = new URL(serverUrl).host; } catch(err) {}
  $('connInfo').textContent = 'Connected to ' + host;
  // Only app versions that can update themselves have this
  $('updateBtn').hidden = !(window.AndroidApp && AndroidApp.checkForUpdate);
  $('connMenu').classList.toggle('open');
}
document.addEventListener('click', () => $('connMenu').classList.remove('open'));

function reconnect() {
  if (window.AndroidApp) { AndroidApp.reconnect(); return; }
  loadListings();
}

function disconnect() {
  if (window.AndroidApp) { AndroidApp.disconnect(); return; }
  if (!confirm('Disconnect from this server? You will need the QR code or API key to connect again.')) return;
  clearCredentials();
  serverUrl = '';
  apiKey = '';
  listings = [];
  showLogin();
}

// ------ Listings ------
async function loadListings() {
  const container = $('listingsContainer');
  container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading listings...</div>';
  try {
    setListings((await apiFetch('/api/listings')).listings);
  } catch(e) {
    if (e.status === 401) { showLogin('This server no longer accepts the saved key. Pair again.'); return; }
    container.innerHTML = errorState('Failed to load listings', 'loadListings()');
  }
}

function setListings(all) {
  listings = all;
  renderStats();
  renderCityChips();
  renderListings();
}

function renderStats() {
  const prices = listings.map(l => l.price).filter(p => p > 10000);
  const avg = prices.length ? prices.reduce((a, b) => a + b, 0) / prices.length : 0;
  const thousands = p => prices.length ? '$' + Math.round(p / 1000) + 'k' : '-';
  $('statsBar').innerHTML = [
    [listings.length, 'Listings'],
    [`<span id="favCount">${countFavorites()}</span>`, 'Favorites'],
    [thousands(avg), 'Avg Price'],
    [thousands(Math.min(...prices)), 'Lowest'],
  ].map(([value, label]) => `
      <div class="stat-card">
        <div class="value">${value}</div>
        <div class="label">${label}</div>
      </div>`).join('');
}

function countFavorites() {
  return listings.reduce((n, l) => n + (l.favorited ? 1 : 0), 0);
}

function renderCityChips() {
  const counts = {};
  for (const l of listings) {
    const city = l.city || 'Unknown';
    counts[city] = (counts[city] || 0) + 1;
  }
  const chip = (city, label) =>
    `<div class="chip${city === currentFilter.city ? ' active' : ''}" data-city="${escHtml(city || '')}" onclick="filterCity(this)">${label}</div>`;
  $('cityFilters').innerHTML = chip(null, 'All') + Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([city, n]) => chip(city, `${escHtml(city)} (${n})`))
    .join('');
}

const SORTS = {
  date: (a, b) => (b.date_added || '').localeCompare(a.date_added || ''),
  price: (a, b) => (a.price || Infinity) - (b.price || Infinity),
  price_desc: (a, b) => (b.price || 0) - (a.price || 0),
  city: (a, b) => (a.city || '').localeCompare(b.city || ''),
};

function visibleListings() {
  return listings
    .filter(l => (!currentFilter.favOnly || l.favorited) && (!currentFilter.city || (l.city || 'Unknown') === currentFilter.city))
    .sort(SORTS[currentFilter.sort] || SORTS.date);
}

function renderListings() {
  const shown = visibleListings();
  const container = $('listingsContainer');
  if (shown.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#x1F3E0;</div><p>No listings found</p></div>';
    return;
  }

  container.innerHTML = shown.map(l => {
    const st = statusInfo(l.status);
    const meta = [l.beds && l.beds + ' bd', l.baths && l.baths + ' ba', l.sqft && l.sqft.toLocaleString() + ' sqft']
      .filter(Boolean).join(' &middot; ');
    const imgHtml = l.image_url
      ? `<img class="card-image" src="${escHtml(l.image_url)}" alt="" loading="lazy" decoding="async" onerror="this.outerHTML='<div class=\\'card-image placeholder\\'>&#x1F3E0;</div>'">`
      : '<div class="card-image placeholder">&#x1F3E0;</div>';

    return `
      <div class="listing-card" onclick="openDetail(${l.id})">
        ${imgHtml}
        <div class="card-body">
          <div class="card-top">
            <div class="card-address">${escHtml(l.address)}${l.unit ? ' #' + escHtml(l.unit) : ''}</div>
            <button class="card-fav ${l.favorited ? 'active' : ''}" id="fav-${l.id}" onclick="event.stopPropagation(); toggleFav(${l.id})">${l.favorited ? '&#9733;' : '&#9734;'}</button>
          </div>
          <div class="card-meta">${meta || escHtml(l.city || l.site)}</div>
          <div class="card-price ${st.sold ? 'sold' : ''}">${l.price ? formatPrice(l.price) : 'No price'}</div>
          <div class="card-badges">
            <span class="badge ${st.cls}">${st.label}</span>
            ${l.city ? `<span class="badge">${escHtml(l.city)}</span>` : ''}
            ${l.type ? `<span class="badge">${escHtml(l.type)}</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

// ------ Filters ------
function filterCity(el) {
  currentFilter.city = el.dataset.city || null;
  document.querySelectorAll('.filters .chip').forEach(c => c.classList.toggle('active', c === el));
  renderListings();
}

function toggleFavFilter() {
  currentFilter.favOnly = !currentFilter.favOnly;
  $('favFilterBtn').classList.toggle('active', currentFilter.favOnly);
  renderListings();
}

function changeSort() {
  currentFilter.sort = $('sortSelect').value;
  renderListings();
}

// ------ Favorites ------
async function toggleFav(id) {
  try {
    const { favorited } = await apiFetch(`/api/listings/${id}/favorite`, { method: 'POST' });
    const listing = listings.find(l => l.id === id);
    if (listing) listing.favorited = favorited;

    // Touch only what changed, so the other cards (and their photos) are left alone
    const btn = $('fav-' + id);
    if (currentFilter.favOnly) {
      renderListings();
    } else if (btn) {
      btn.classList.toggle('active', favorited);
      btn.innerHTML = favorited ? '&#9733;' : '&#9734;';
    }
    $('favCount').textContent = countFavorites();

    if (currentDetailId === id && detailData) {
      detailData.favorited = favorited;
      updateDetailFavBtn();
    }
  } catch(e) {
    console.error('Toggle favorite failed:', e);
  }
}

// ------ Detail view ------
// Opening a listing adds a history entry, so the phone's Back button closes it.
async function openDetail(id) {
  currentDetailId = id;
  const overlay = $('detailOverlay');
  const content = $('detailContent');

  content.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';
  $('detailTitle').textContent = 'Loading...';
  if (!overlay.classList.contains('open')) history.pushState({ detail: true }, '');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  try {
    const data = await apiFetch(`/api/listings/${id}`);
    if (currentDetailId !== id) return;  // closed or replaced while loading
    detailData = data;
    renderDetail();
  } catch(e) {
    if (currentDetailId === id) content.innerHTML = errorState('Failed to load listing', `openDetail(${id})`);
  }
}

function hideDetail() {
  $('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
  currentDetailId = null;
  detailData = null;
}

window.addEventListener('popstate', () => {
  if ($('detailOverlay').classList.contains('open')) hideDetail();
});

function renderDetail() {
  const d = detailData;
  const snap = d.snapshot || {};
  const st = statusInfo(snap.status);
  $('detailTitle').textContent = d.address + (d.unit ? ' #' + d.unit : '');
  updateDetailFavBtn();

  // Gallery
  let galleryHtml = '';
  if (d.images && d.images.length > 0) {
    currentGalleryIndex = 0;
    galleryHtml = `
      <div class="detail-gallery" id="galleryContainer">
        <img id="galleryImg" src="${escHtml(d.images[0])}" alt="" decoding="async" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>'">
        ${d.images.length > 1 ? `
          <button class="gallery-nav prev" onclick="galleryNav(-1)">&#8249;</button>
          <button class="gallery-nav next" onclick="galleryNav(1)">&#8250;</button>
          <div class="gallery-counter" id="galleryCounter">1 / ${d.images.length}</div>
        ` : ''}
      </div>`;
  }

  // Info grid
  const sqftLo = snap.sqft_min || snap.sqft_max;
  const sqftRange = sqftLo && (sqftLo.toLocaleString() +
    (snap.sqft_max && snap.sqft_max !== sqftLo ? ' - ' + snap.sqft_max.toLocaleString() : ''));
  const fields = [
    ['Status', st.label],
    ['Beds', snap.beds],
    ['Baths', snap.baths],
    ['Sqft', sqftRange],
    ['Maintenance', snap.maintenance_fee && '$' + snap.maintenance_fee.toLocaleString() + '/mo'],
    ['Taxes', snap.taxes_annual && '$' + snap.taxes_annual.toLocaleString() + '/yr'],
    ['Parking', snap.parking],
    ['Locker', snap.locker],
    ['Balcony', snap.balcony],
    ['Exposure', snap.exposure],
    ['Type', snap.property_type],
    ['Year Built', snap.year_built],
    ['Laundry', snap.ensuite_laundry],
    ['Outdoor', snap.outdoor_space],
    ['Possession', snap.possession_date],
    ['Listed', formatDate(d.list_date)],
    ['Days on Market', d.days_on_market],
    ['Broker', snap.broker],
    ['Site Estimate', snap.site_estimate && formatPrice(snap.site_estimate)],
  ].filter(([, value]) => value != null && value !== '');

  const infoHtml = fields.map(([label, value]) => `
    <div class="info-item">
      <div class="info-label">${escHtml(label)}</div>
      <div class="info-value">${escHtml(String(value))}</div>
    </div>`).join('');

  // Peer stats
  let peerHtml = '';
  const ps = d.peer_stats;
  if (ps && ps.peer_count) {
    const below = ps.discount_pct > 0;
    peerHtml = `
      <div class="section-title">Market Comparison</div>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">$/sqft</div>
          <div class="info-value">$${Math.round(ps.this_ppsf)}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Avg $/sqft (${ps.peer_count} peers)</div>
          <div class="info-value">$${Math.round(ps.avg_ppsf)}</div>
        </div>
        <div class="info-item" style="grid-column: span 2">
          <div class="info-label">vs Market</div>
          <div class="info-value" style="color:${below ? 'var(--green)' : 'var(--red)'}">${below ? '&#x2193;' : '&#x2191;'} ${Math.abs(ps.discount_pct).toFixed(1)}% ${below ? 'below' : 'above'} average</div>
        </div>
      </div>`;
  }

  const historyHtml = renderPriceHistory(d.price_history || []);
  const forecastHtml = renderForecast(d.next_drop);

  const feeHtml = snap.fee_includes ? `
    <div class="section-title">Fee Includes</div>
    <div class="info-item" style="margin-bottom:12px">
      <div class="info-value" style="font-size:13px; font-weight:400; line-height:1.5">${escHtml(snap.fee_includes)}</div>
    </div>` : '';

  const place = [d.city, d.neighbourhood, d.building_name].filter(Boolean).map(escHtml).join(' &middot; ');

  $('detailContent').innerHTML = `
    ${galleryHtml}
    <div class="detail-content">
      <div class="detail-price ${st.sold ? 'sold' : ''}">
        ${snap.list_price ? formatPrice(snap.list_price) : 'No price'}
        <span class="detail-status-badge badge ${st.cls}">${st.label}</span>
      </div>
      <div style="color: var(--text2); margin-top:4px; font-size:14px">${place}</div>
      ${d.mls_number ? `<div style="color:var(--text2); font-size:12px; margin-top:2px">MLS# ${escHtml(d.mls_number)}</div>` : ''}

      <div class="info-grid" style="margin-top:16px">${infoHtml}</div>

      ${peerHtml}
      ${forecastHtml}
      ${historyHtml}
      ${feeHtml}

      ${d.favorited ? '<div id="compSection"></div>' : ''}

      <a class="detail-link" href="${escHtml(d.url)}" target="_blank" rel="noopener">View on ${escHtml(d.site)}</a>
    </div>`;

  if (d.favorited) loadComparables(d.id);
}

// Asking prices as [date, price] pairs, one per change, oldest first; shown newest first
function renderPriceHistory(points) {
  if (!points.length) return '';
  const [firstDate, firstPrice] = points[0];
  const current = points[points.length - 1][1];
  const cuts = points.filter((p, i) => i && p[1] < points[i - 1][1]).length;
  const change = current - firstPrice;
  const summary = points.length < 2
    ? `No price changes since it was listed on ${formatDate(firstDate)}`
    : `<span class="${change < 0 ? 'down' : 'up'}">${change < 0 ? 'Down' : 'Up'} ${formatPrice(Math.abs(change))} (${pct(change, firstPrice)})</span>` +
      ` since ${formatDate(firstDate)} &middot; ${cuts} cut${cuts === 1 ? '' : 's'}`;

  const rows = points.map(([date, price], i) => {
    if (!i) return { date, price, note: 'Listed', change: '' };
    const [prevDate, prevPrice] = points[i - 1];
    const diff = price - prevPrice;
    return {
      date, price,
      note: daysBetween(prevDate, date) + ' days later',
      change: `<div class="history-change ${diff < 0 ? 'down' : 'up'}">${signedMoney(diff)} (${pct(diff, prevPrice)})</div>`,
    };
  }).reverse();

  return `<div class="section-title">Price History</div>
    <div class="history-summary">${summary}</div>` + rows.map(r => `
      <div class="history-item">
        <div>
          <div class="history-date">${formatDate(r.date)}</div>
          <div class="history-note">${r.note}</div>
        </div>
        <div>
          <div class="history-price">${formatPrice(r.price)}</div>
          ${r.change}
        </div>
      </div>`).join('');
}

function renderForecast(f) {
  if (!f) return '';
  const when = f.overdue ? 'Due now' : 'Around ' + formatDate(f.expected);
  const range = f.overdue ? `Likely by ${formatDate(f.latest)}` : `Likely between ${formatDate(f.earliest)} and ${formatDate(f.latest)}`;
  return `<div class="section-title">Next Price Drop</div>
    <div class="forecast-card">
      <div class="forecast-head">
        <div class="forecast-when">${when}</div>
        <div class="forecast-conf ${escHtml(f.confidence)}">${escHtml(f.confidence)} confidence</div>
      </div>
      <div class="forecast-window">${range}</div>
      <div class="forecast-price">To about <b>${formatPrice(f.price)}</b> <span class="down">(&minus;${f.pct}%)</span></div>
      <div class="forecast-basis">${escHtml(f.basis)}</div>
    </div>`;
}

const COMP_TITLE = '<div class="section-title">Comparable Properties</div>';

async function loadComparables(listingId) {
  const el = $('compSection');
  if (!el) return;
  el.innerHTML = COMP_TITLE + '<div style="color:var(--text2);font-size:12px">Loading...</div>';
  try {
    renderComparables(el, await apiFetch(`/api/listings/${listingId}/comparables`));
  } catch(e) {
    el.innerHTML = COMP_TITLE + '<div style="color:var(--text2);font-size:12px">Could not load comparables</div>';
  }
}

function renderComparables(el, data) {
  const comps = data.comparables || [];
  const favPrice = data.favorite_price || 0;
  const tol = data.tolerance || 25000;

  if (!comps.length) {
    el.innerHTML = COMP_TITLE + `
      <div style="color:var(--text2);font-size:12px;padding:12px 0">
        No comparables found yet. Similar properties priced above yours are
        discovered during scheduled checks.
        <button class="comp-scan-btn" onclick="scanComparables()">Scan Now</button>
      </div>`;
    return;
  }

  let html = `<div class="section-title">Comparable Properties (${comps.length})</div>
    <div style="color:var(--text2);font-size:11px;margin-bottom:8px">Target: $${(favPrice-tol).toLocaleString()} &mdash; $${(favPrice+tol).toLocaleString()}</div>`;

  for (const c of comps.slice(0, 10)) {
    const gap = c.price_gap;
    const gapTxt = signedMoney(gap) + (c.in_range ? ' &middot; IN RANGE' : '');
    const gapClass = c.in_range ? 'hit' : gap <= tol * 2 ? 'near' : 'far';
    const specs = [c.beds && c.beds + ' bd', c.baths && c.baths + ' ba', c.sqft && c.sqft.toLocaleString() + ' sqft']
      .filter(Boolean).join(' · ');

    let trendHtml = '';
    if (c.trend_pct_month) {  // a listing that never changed price has no trend to show
      const down = c.trend_pct_month < 0;
      trendHtml = `<div class="comp-trend ${down ? 'down' : 'up'}">${down ? '&#x2193;' : '&#x2191;'} ${Math.abs(c.trend_pct_month).toFixed(1)}%/mo` +
        (c.predicted_target_date ? ` &mdash; in range by ~${formatDate(c.predicted_target_date)}` : '') + '</div>';
    }

    html += `
      <div class="comp-card ${c.in_range ? 'in-range' : ''}" onclick="openDetail(${c.listing_id})">
        <div class="comp-addr">${escHtml(c.address)} &mdash; ${escHtml(c.city)}</div>
        <div class="comp-price-row">
          <span class="comp-price">$${c.current_price.toLocaleString()}</span>
          <span class="comp-gap ${gapClass}">${gapTxt}</span>
          <span class="comp-score">Match: ${Math.round(c.similarity_score)}%</span>
        </div>
        ${specs ? `<div class="comp-specs">${specs}</div>` : ''}
        ${trendHtml}
      </div>`;
  }

  el.innerHTML = html + '<button class="comp-scan-btn" onclick="scanComparables()">Rescan Comparables</button>';
}

async function scanComparables() {
  try {
    const btn = document.querySelector('.comp-scan-btn');
    if (btn) { btn.textContent = 'Scanning...'; btn.disabled = true; }
    await apiFetch('/api/scan-comparables', { method: 'POST' });
    if (currentDetailId) loadComparables(currentDetailId);
  } catch(e) {
    alert('Scan failed: ' + e.message);
  }
}

function updateDetailFavBtn() {
  const btn = $('detailFavBtn');
  if (!detailData) return;
  btn.innerHTML = detailData.favorited ? '&#9733;' : '&#9734;';
  btn.style.color = detailData.favorited ? 'var(--gold)' : 'var(--text2)';
}

function toggleDetailFav() {
  if (currentDetailId) toggleFav(currentDetailId);
}

function galleryNav(dir) {
  if (!detailData || !detailData.images) return;
  const imgs = detailData.images;
  currentGalleryIndex = (currentGalleryIndex + dir + imgs.length) % imgs.length;
  $('galleryImg').src = imgs[currentGalleryIndex];
  const counter = $('galleryCounter');
  if (counter) counter.textContent = (currentGalleryIndex + 1) + ' / ' + imgs.length;
}

// Touch swipe on gallery
let touchStartX = 0;
document.addEventListener('touchstart', e => {
  const gallery = $('galleryContainer');
  if (gallery && gallery.contains(e.target)) touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', e => {
  const gallery = $('galleryContainer');
  if (gallery && gallery.contains(e.target) && touchStartX) {
    const diff = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(diff) > 50) galleryNav(diff < 0 ? 1 : -1);
    touchStartX = 0;
  }
});

// ------ Helpers ------
function statusInfo(status) {
  const s = status || 'UNKNOWN';
  const sold = SOLD_STATUSES.has(s);
  return { label: STATUS_LABELS[s] || s, sold, cls: s === 'FOR_SALE' ? 'for-sale' : sold ? 'sold' : '' };
}
function errorState(message, retryCall) {
  return `<div class="empty-state"><div class="icon">&#x26A0;</div><p>${escHtml(message)}</p>` +
    `<button class="retry-btn" onclick="${retryCall}">Retry</button></div>`;
}
function formatPrice(p) {
  if (!p) return 'N/A';
  return '$' + Number(p).toLocaleString('en-CA', { maximumFractionDigits: 0 });
}
// A bare YYYY-MM-DD is a calendar date; read it as local midnight, not UTC (a day early here)
function toDate(d) { return new Date(d.length === 10 ? d + 'T00:00' : d); }
function formatDate(d) {
  if (!d) return '';
  const date = toDate(d);
  return isNaN(date) ? d : date.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
}
function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }
function signedMoney(n) { return (n < 0 ? '&minus;' : '+') + formatPrice(Math.abs(n)); }
function pct(part, whole) { return (Math.abs(part) / whole * 100).toFixed(1) + '%'; }
const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escHtml(s) {
  return s == null ? '' : String(s).replace(/[&<>"']/g, c => HTML_ESCAPES[c]);
}

// ------ QR Scanner (browser version; the Android app scans natively) ------
let qrStream = null;
let qrDetector = null;

async function startQrScan() {
  if (!('BarcodeDetector' in window)) {
    alert('This browser cannot scan QR codes. Enter the connection details manually.');
    return;
  }
  const overlay = $('qrScanOverlay');
  const video = $('qrVideo');
  overlay.classList.add('active');
  try {
    qrStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = qrStream;
    qrDetector = qrDetector || new BarcodeDetector({ formats: ['qr_code'] });
    scanQrFrame();
  } catch (err) {
    overlay.classList.remove('active');
    alert('Camera access denied. Please allow camera access to scan QR codes, or enter the connection details manually.');
  }
}

function stopQrScan() {
  $('qrScanOverlay').classList.remove('active');
  if (qrStream) {
    qrStream.getTracks().forEach(t => t.stop());
    qrStream = null;
  }
}

async function scanQrFrame() {
  if (!qrStream) return;
  const video = $('qrVideo');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    try {
      const codes = await qrDetector.detect(video);
      if (codes.length > 0) { handleQrResult(codes[0].rawValue); return; }
    } catch (e) { /* try the next frame */ }
  }
  requestAnimationFrame(scanQrFrame);
}

function handleQrResult(raw) {
  stopQrScan();
  try {
    const data = JSON.parse(raw);
    if (!data.url || !data.key) throw new Error('missing fields');
    serverUrl = data.url;
    apiKey = data.key;
    $('serverUrl').value = serverUrl;
    $('apiKeyInput').value = apiKey;
    doLogin();
  } catch (e) {
    alert('Could not read QR code. Please scan the code shown in the desktop app.');
  }
}

// ------ Init ------
// The Android app passes the key in the fragment (#key=...), which is never sent to the server.
const hashParams = new URLSearchParams(location.hash.slice(1));
if (hashParams.get('key')) {
  apiKey = hashParams.get('key');
  serverUrl = hashParams.get('url') || location.origin;
  history.replaceState(null, '', location.pathname);
} else {
  loadCredentials();
}
if (serverUrl && apiKey) {
  connect().catch(() => showLogin('Could not connect to the saved server.'));
} else if (['localhost', '127.0.0.1', '10.0.2.2'].includes(location.hostname)) {
  $('serverUrl').value = location.origin;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
